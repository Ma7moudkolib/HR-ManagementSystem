<div *ngIf="isLoggedIn()" class="flex h-screen bg-surface font-body text-on-surface">
  <!-- Sidebar -->
  <aside class="w-64 bg-surface-container-low flex flex-col h-full border-r-[1px] border-surface-container-high border-opacity-10">
    <div class="p-6">
      <h1 class="font-display font-bold text-xl text-primary tracking-tight">Executive Architect</h1>
      <p class="text-[11px] text-on-surface-variant font-medium tracking-widest uppercase mt-2">HR Administrator</p>
    </div>
    
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a routerLink="/companies" routerLinkActive="active" #rlaCompanies="routerLinkActive"
         class="flex items-center space-x-3 px-3 py-2.5 rounded-lg relative group transition-all"
         [ngClass]="rlaCompanies.isActive ? 'text-on-surface font-semibold bg-surface-container' : 'text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high'">
         <span *ngIf="rlaCompanies.isActive" class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-3/4 bg-primary rounded-r-md"></span>
        <span class="material-icons text-[20px]" [ngClass]="{'text-primary': rlaCompanies.isActive}">business</span>
        <span>Companies</span>
      </a>
      
      <a routerLink="/employees" routerLinkActive="active" #rlaEmployees="routerLinkActive"
         class="flex items-center space-x-3 px-3 py-2.5 rounded-lg relative group transition-all"
         [ngClass]="rlaEmployees.isActive ? 'text-on-surface font-semibold bg-surface-container' : 'text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high'">
         <span *ngIf="rlaEmployees.isActive" class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-3/4 bg-primary rounded-r-md"></span>
        <span class="material-icons text-[20px]" [ngClass]="{'text-primary': rlaEmployees.isActive}">group</span>
        <span>Employees</span>
      </a>

      <a routerLink="/attendance" routerLinkActive="active" #rlaAttendance="routerLinkActive"
         class="flex items-center space-x-3 px-3 py-2.5 rounded-lg relative group transition-all"
         [ngClass]="rlaAttendance.isActive ? 'text-on-surface font-semibold bg-surface-container' : 'text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high'">
         <span *ngIf="rlaAttendance.isActive" class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-3/4 bg-primary rounded-r-md"></span>
        <span class="material-icons text-[20px]" [ngClass]="{'text-primary': rlaAttendance.isActive}">event_available</span>
        <span>Attendance</span>
      </a>

      <a routerLink="/leave" routerLinkActive="active" #rlaLeave="routerLinkActive"
         class="flex items-center space-x-3 px-3 py-2.5 rounded-lg relative group transition-all"
         [ngClass]="rlaLeave.isActive ? 'text-on-surface font-semibold bg-surface-container' : 'text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high'">
         <span *ngIf="rlaLeave.isActive" class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-3/4 bg-primary rounded-r-md"></span>
        <span class="material-icons text-[20px]" [ngClass]="{'text-primary': rlaLeave.isActive}">event_busy</span>
        <span>Leave Dashboard</span>
      </a>

      <a routerLink="/payroll" routerLinkActive="active" #rlaPayroll="routerLinkActive"
         class="flex items-center space-x-3 px-3 py-2.5 rounded-lg relative group transition-all"
         [ngClass]="rlaPayroll.isActive ? 'text-on-surface font-semibold bg-surface-container' : 'text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high'">
         <span *ngIf="rlaPayroll.isActive" class="absolute left-0 top-1/2 -translate-y-1/2 w-1 h-3/4 bg-primary rounded-r-md"></span>
        <span class="material-icons text-[20px]" [ngClass]="{'text-primary': rlaPayroll.isActive}">payments</span>
        <span>Payroll Summary</span>
      </a>
    </nav>
    
    <div class="p-4 flex flex-col space-y-1 mb-2">
      <a href="#" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-container-high transition-colors">
        <span class="material-icons text-[20px]">settings</span>
        <span class="font-medium">Settings</span>
      </a>
      <a (click)="logout()" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-error hover:bg-error-container hover:text-error transition-colors cursor-pointer">
        <span class="material-icons text-[20px]">logout</span>
        <span class="font-medium">Logout</span>
      </a>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col overflow-hidden relative">
    <!-- Topbar -->
    <header class="h-20 flex items-center justify-between px-10 bg-surface/80 backdrop-blur-md sticky top-0 z-10 w-full">
      <div class="flex items-center space-x-4">
        <div class="relative group">
            <input type="text" placeholder="Search across systems..." class="w-80 bg-surface-container-low focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary-container/20 text-sm font-medium py-2.5 pl-10 pr-4 rounded-full transition-all">
            <span class="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
        </div>
      </div>
      <div class="flex items-center space-x-6">
        <button class="relative p-2 rounded-full text-on-surface-variant hover:bg-surface-container-high transition-colors">
          <span class="material-icons">notifications</span>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-error rounded-full"></span>
        </button>
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary flex items-center justify-center font-bold font-display shadow-md shadow-primary/20 cursor-pointer">
          EA
        </div>
      </div>
    </header>

    <!-- Router Outlet -->
    <div class="flex-1 overflow-y-auto px-10 pb-10 mt-6">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<!-- Unauthenticated routing view -->
<div *ngIf="!isLoggedIn()">
  <router-outlet></router-outlet>
</div>
