name: Backend CI

on:
  push:
    branches: [ "master" ]
    paths:
      - 'Backend/src/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'Backend/src/**'


jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Restore dependencies
      run: dotnet restore ./Backend/src/CompanyEmployee.sln
    - name: Build
      run: dotnet build ./Backend/src/CompanyEmployee.sln --no-restore --configuration Release
    - name: Test
      run: dotnet test ./Backend/src/CompanyEmployee.sln --no-build --verbosity normal
