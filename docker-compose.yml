version: '3.8'

networks:
  hr-network:
    driver: bridge

services:
  hrms-frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: hrms-frontend
    ports:
      - "80:80"
    depends_on:
      - hr-system-api
    networks:
      - hr-network

  hr-system-api:
    build: 
      context: .
      dockerfile: ./Backend/dockerfile
    container_name: hr-system-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__sqlConnection=Host=postgres;Port=5432;Database=CompanyEmployees;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hr-network

  postgres:
    image: postgres:alpine
    restart: always
    container_name: postgres
    ports:
      - "5432:5432"
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 10s
        timeout: 5s
        retries: 5
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=CompanyEmployees
    volumes:
      - postgres-db:/var/lib/postgresql/data
    networks:
      - hr-network

volumes:
  postgres-db: